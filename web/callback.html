<!doctype html>
<!--
  The OAuth redirect URI for the web build (see WebRedirectReceiver).
  callback.js hands its URL, with the code and state, back to the app's
  tab. It needs no other scripts, and no connections.
-->
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Time Tracker</title>
<body style="font-family:sans-serif;text-align:center;padding-top:4em">
<h2 id="heading">Signed in</h2>
<p>You can close this window and return to Time Tracker.</p>
<script src="callback.js"></script>
</body>
