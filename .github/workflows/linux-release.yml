# Packages the web app for a self-hosted server built with AUTH_DISABLED,
# which serves it beside /mcp (its STATIC_SITE_DIR), on every push to main
# that changes the version, and copies it to a Google Drive folder (with
# the DRIVE_RCLONE_CONF secret). See "Linux release packages" in
# README.md.
name: Linux release

on:
  push:
    branches: [main]
  # Builds and packages (to check it still does) but doesn't publish.
  pull_request:
    paths:
      - .github/workflows/linux-release.yml
      - tool/ci/publish_to_drive.sh
      - tool/web_csp.dart
  workflow_dispatch:

permissions:
  contents: read

# Each run publishes the version it built; one at a time, in order.
concurrency:
  group: linux-release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
      DRIVE_FOLDER: ${{ vars.DRIVE_FOLDER || 'gdrive:TimeTracker' }}
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
          echo "name=time-tracker-web-$version-for-AUTH_DISABLED-server" >> "$GITHUB_OUTPUT"
      - name: Set up rclone
        id: drive
        if: env.PUBLISH == 'true'
        env:
          DRIVE_RCLONE_CONF: ${{ secrets.DRIVE_RCLONE_CONF }}
        # A push that doesn't change the app keeps its version, whose
        # package is already in the folder.
        run: |
          if [ -z "$DRIVE_RCLONE_CONF" ]; then
            echo "::warning::No DRIVE_RCLONE_CONF secret, so there's nowhere to publish to (see Linux release packages in README.md)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          mkdir -p ~/.config/rclone
          printf '%s\n' "$DRIVE_RCLONE_CONF" > ~/.config/rclone/rclone.conf
          name=${{ steps.version.outputs.name }}
          if [ -n "$(rclone lsf "$DRIVE_FOLDER" --max-depth 1 --include "$name.tar.gz")" ]; then
            echo "$name is already in $DRIVE_FOLDER."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: subosito/flutter-action@v2
        if: steps.drive.outputs.skip != 'true'
        with:
          channel: stable
          cache: true
      - name: Build
        if: steps.drive.outputs.skip != 'true'
        # The server serves the app at its root, and /mcp on the same
        # origin: the policy needs no other server, and no AuthKit, since
        # an AUTH_DISABLED server has no sign-in.
        run: |
          flutter pub get
          flutter build web --release --csp --no-web-resources-cdn \
            --base-href / --dart-define=MCP_URL=/mcp
          dart run tool/web_csp.dart build/web /mcp
      - name: Package
        if: steps.drive.outputs.skip != 'true'
        run: |
          name=${{ steps.version.outputs.name }}
          mkdir dist
          tar -czf "dist/$name.tar.gz" --transform "s,^web,$name," -C build web
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          ls -l dist
      - name: Copy to Google Drive
        if: env.PUBLISH == 'true' && steps.drive.outputs.skip != 'true'
        run: tool/ci/publish_to_drive.sh time-tracker-web- dist/*
