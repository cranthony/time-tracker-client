# Builds the web app and publishes it to GitHub Pages on every push to main.
# Needs the repository variable MCP_URL (Settings → Secrets and variables →
# Actions → Variables): the same value as config.json's MCP_URL.
name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check MCP_URL is set
        # Without it the build would silently be the offline demo.
        run: test -n "${{ vars.MCP_URL }}" || { echo "::error::Set the MCP_URL repository variable"; exit 1; }
      - run: flutter pub get
      - run: flutter test
      - name: Build
        # Pages serves a project site under /<repo>/, so the app's base
        # href (and with it the sign-in redirect URI) must match.
        # --no-web-resources-cdn serves CanvasKit from the app's own site
        # instead of Google's, and --csp avoids generating code at run
        # time; both are needed for the Content-Security-Policy below.
        run: >
          flutter build web --release --csp --no-web-resources-cdn
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=MCP_URL=${{ vars.MCP_URL }}
      - name: Add the Content-Security-Policy
        run: dart run tool/web_csp.dart build/web "${{ vars.MCP_URL }}"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
