# Runs the release app on an Android emulator (Android 16, with animations
# on, like a phone) and checks what only a real Android device can show.
# The device logs and screenshots are kept as the run's artifacts.
#
# Tests belong here only when they need Android itself: its intents and
# home screen widgets, the system keyboard, start-up from a cold process,
# and the like. Everything else, animations included, should be a Flutter
# widget test in test/, which runs in seconds on a fake clock and can
# check any frame; tests here take minutes and can only poke the app from
# outside with adb. Each test is a script in tool/emulator/, run by a job
# of its own below, side by side, each on its own emulator; the two that
# test the release app share the one APK the apk job builds.
# tool/emulator/sdk_retry.sh, which isn't a test, tries the SDK's
# downloads again when they come back broken. The
# android-emulator job, which the main branch's rules require, passes
# once they all have.
#
# Now:
#   tool/emulator/keyboard_test.sh  the home screen "+" opens the New note
#                                   dialog with the keyboard up, and the
#                                   goal button the New goal sheet.
#   tool/emulator/handoff_test.sh   changes waiting to save are handed off
#                                   between the app and its WorkManager
#                                   background task, each sent once.
#   tool/emulator/calendar_widget_test.sh
#                                   the home screen calendar shows the
#                                   sample events and goals, and its taps
#                                   open Events, and the New note dialog.
name: Emulator tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # On a pull request, whether anything the release APK or the test script
  # uses has changed (see needs-run.yml).
  changes:
    uses: ./.github/workflows/needs-run.yml
    permissions:
      contents: read
      checks: read
    with:
      check: android-emulator
      paths: >-
        . :!.claude :!test :!web :!windows :(exclude,glob)**/*.md
        :(exclude,glob)tool/* :!tool/icon
        :!.github/workflows/android.yml :!.github/workflows/pages.yml
        :!.github/workflows/version.yml :!.github/workflows/visual.yml

  # The release app, for real start-up timing. Without MCP_URL it's the
  # offline demo, with the sample data for the calendar widget to show,
  # and its menu offering to add the widget to the home screen, which
  # there's no adb command for.
  apk:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Gradle installs the NDK the first time, a download that sometimes
      # comes back broken: sdk_retry.sh tries again then.
      - run: >-
          tool/emulator/sdk_retry.sh
          flutter build apk --release --target-platform android-x64
          --dart-define=SAMPLE_DATA=true --dart-define=CALENDAR_PIN=true
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1

  keyboard:
    needs: apk
    if: ${{ !cancelled() && needs.apk.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The emulator runner installs these too, but fails at the first
      # broken download; here they're tried again (see sdk_retry.sh).
      - name: Install the emulator
        run: |
          sdkmanager=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | "$sdkmanager" --licenses > /dev/null || true
          tool/emulator/sdk_retry.sh "$sdkmanager" --install emulator \
            'system-images;android-36;google_apis;x86_64'
      - name: Home screen "+" and goal button bring up the keyboard
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: false
          script: tool/emulator/keyboard_test.sh build/app/outputs/flutter-apk/app-release.apk
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-keyboard
          path: build/emulator

  calendar:
    needs: apk
    if: ${{ !cancelled() && needs.apk.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The emulator runner installs these too, but fails at the first
      # broken download; here they're tried again (see sdk_retry.sh).
      - name: Install the emulator
        run: |
          sdkmanager=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | "$sdkmanager" --licenses > /dev/null || true
          tool/emulator/sdk_retry.sh "$sdkmanager" --install emulator \
            'system-images;android-36;google_apis;x86_64'
      - name: Home screen calendar shows the events, and its taps open the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          script: tool/emulator/calendar_widget_test.sh build/app/outputs/flutter-apk/app-release.apk
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-calendar
          path: build/emulator

  # Its own debug build, of integration_test/: the background task runs
  # in an isolate of its own, as on a phone. So it doesn't wait for the
  # APK.
  handoff:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Built before the emulator starts, so that flutter test, there,
      # has little left to build; and the NDK's download, on the first
      # build, can be tried again (see sdk_retry.sh).
      - name: Build the test app
        run: >-
          tool/emulator/sdk_retry.sh
          flutter build apk --debug --target-platform android-x64
          -t integration_test/outbox_handoff_test.dart
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The emulator runner installs these too, but fails at the first
      # broken download; here they're tried again (see sdk_retry.sh).
      - name: Install the emulator
        run: |
          sdkmanager=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | "$sdkmanager" --licenses > /dev/null || true
          tool/emulator/sdk_retry.sh "$sdkmanager" --install emulator \
            'system-images;android-36;google_apis;x86_64'
      - name: Changes are handed off between the app and its background task
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          script: tool/emulator/handoff_test.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-handoff
          path: build/emulator

  # The check the main branch's rules require: passes once every test
  # has, or was skipped (nothing it tests changed).
  android-emulator:
    needs: [changes, apk, keyboard, calendar, handoff]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: >-
            apk=${{ needs.apk.result }}
            keyboard=${{ needs.keyboard.result }}
            calendar=${{ needs.calendar.result }}
            handoff=${{ needs.handoff.result }}
        run: |
          for r in $RESULTS; do
            echo "$r"
          done
          for r in $RESULTS; do
            case ${r#*=} in
              success | skipped) ;;
              *) echo "::error::${r%%=*}: ${r#*=}"; exit 1 ;;
            esac
          done
