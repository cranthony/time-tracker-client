# Builds a signed release APK and app bundle on every push to main, and
# publishes both as a GitHub Release. The newest APK is always at
#   https://github.com/<owner>/<repo>/releases/latest/download/time-tracker.apk
# Once the PLAY_SERVICE_ACCOUNT_JSON secret is set, the bundle also goes
# to Google Play's internal testing track.
#
# Needs the repository variable MCP_URL (as for pages.yml) and the secrets
# ANDROID_KEYSTORE_BASE64 (a PKCS#12 keystore whose key alias is "upload")
# and ANDROID_KEYSTORE_PASSWORD. Every build must use that same key, or
# Android won't install it over the previous one, and Play, which uses it
# as the upload key, won't accept it.
name: Build Android app

on:
  push:
    branches: [main]
  # Builds (to check it still does) but doesn't publish.
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Secrets can't be tested in `if:` directly; this can.
      HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check configuration
        env:
          MCP_URL: ${{ vars.MCP_URL }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Without MCP_URL the app would be the offline demo; without the
          # key it would be signed with a throwaway debug key.
          test -n "$MCP_URL" || { echo "::error::Set the MCP_URL repository variable"; exit 1; }
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" ||
            { echo "::error::Set the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets"; exit 1; }
      - run: flutter pub get
      - run: flutter test
      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.p12"
          # Read by android/app/build.gradle.kts. PKCS#12 keystores have a
          # single password, for the store and the key alike.
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.p12
          storeType=pkcs12
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=upload
          keyPassword=$KEYSTORE_PASSWORD
          EOF
      - name: Build
        # The run number is the versionCode, so each build counts as an
        # update of the last. The APK is for installing directly; the app
        # bundle (.aab) is what Google Play takes.
        run: |
          for target in apk appbundle; do
            flutter build "$target" --release \
              --build-number=${{ github.run_number }} \
              --dart-define=MCP_URL=${{ vars.MCP_URL }}
          done
      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk time-tracker.apk
          cp build/app/outputs/bundle/release/app-release.aab time-tracker.aab
          gh release create "android-${{ github.run_number }}" time-tracker.apk time-tracker.aab \
            --title "Android build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}." \
            --latest
      - name: Upload to Google Play (internal testing)
        # Google's API can't create an app's first release, so the first
        # bundle is uploaded by hand in the Play Console. Until then, and
        # until the secret is set, this is skipped.
        if: github.event_name != 'pull_request' && env.HAS_PLAY_KEY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.cranthony.timetracker
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
