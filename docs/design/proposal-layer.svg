<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 372" width="900" height="372" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12">
  <title>The proposal as a layer over the calendar</title>
  <desc>The dance and sleep example, with through at 20:00. The layer's last event, the dance, runs to 22:30, which is the layer's end. Under the layer, Get ready for bed and Journal are covered, and Sleep, the calendar event overlapping the layer's end, is cut to start at 22:30.</desc>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#f7f7f7"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#dcdcdc" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="900" height="372" fill="#ffffff"/>

  <!-- time axis -->
  <g fill="#555" text-anchor="middle" font-size="11">
    <text x="150" y="22">18:00</text>
    <text x="270" y="22">19:00</text>
    <text x="390" y="22">20:00</text>
    <text x="510" y="22">21:00</text>
    <text x="630" y="22">22:00</text>
    <text x="750" y="22">23:00</text>
    <text x="870" y="22">00:00</text>
  </g>
  <g stroke="#e3e3e3">
    <line x1="150" y1="30" x2="150" y2="300"/>
    <line x1="270" y1="30" x2="270" y2="300"/>
    <line x1="510" y1="30" x2="510" y2="300"/>
    <line x1="630" y1="30" x2="630" y2="300"/>
    <line x1="750" y1="30" x2="750" y2="300"/>
    <line x1="870" y1="30" x2="870" y2="300"/>
  </g>

  <!-- what the layer covers -->
  <rect x="150" y="38" width="540" height="162" fill="#2f6fde" fill-opacity="0.07"/>

  <!-- row labels -->
  <g fill="#222" font-weight="600">
    <text x="10" y="66">Proposal</text>
    <text x="10" y="150">Calendar</text>
    <text x="10" y="252">Once confirmed</text>
  </g>
  <g fill="#666" font-size="11">
    <text x="10" y="81">the layer on top</text>
    <text x="10" y="165">the plan underneath</text>
  </g>

  <!-- proposal row -->
  <g stroke="#2f6fde" stroke-width="1.5">
    <rect x="210" y="46" width="60" height="44" rx="4" fill="#cfe0fa"/>
    <rect x="270" y="46" width="120" height="44" rx="4" fill="#cfe0fa"/>
    <rect x="390" y="46" width="300" height="44" fill="#e9f1fd" stroke-dasharray="5 3"/>
  </g>
  <line x1="690" y1="42" x2="690" y2="94" stroke="#1d4fb0" stroke-width="5"/>
  <g fill="#123a7a">
    <text x="240" y="72" text-anchor="middle">Dinner</text>
    <text x="330" y="72" text-anchor="middle">Dance class</text>
    <text x="540" y="65" text-anchor="middle">its tail, past through</text>
    <text x="540" y="81" text-anchor="middle" font-size="11">end set by you at 22:30: locked</text>
  </g>

  <!-- calendar row -->
  <g stroke="#8a8a8a" stroke-width="1.2">
    <rect x="210" y="128" width="60" height="44" rx="4" fill="#ededed"/>
    <rect x="270" y="128" width="240" height="44" rx="4" fill="#ededed"/>
    <rect x="510" y="128" width="60" height="44" rx="4" fill="url(#hatch)" stroke-dasharray="4 3"/>
    <rect x="570" y="128" width="60" height="44" rx="4" fill="url(#hatch)" stroke-dasharray="4 3"/>
    <rect x="630" y="128" width="60" height="44" fill="url(#hatch)" stroke-dasharray="4 3"/>
    <rect x="690" y="128" width="200" height="44" fill="#ededed"/>
  </g>
  <g fill="#333">
    <text x="240" y="154" text-anchor="middle">Dinner</text>
    <text x="330" y="154" text-anchor="middle">Dance class</text>
    <text x="450" y="154" text-anchor="middle" font-size="11">planned to 21:00</text>
    <text x="790" y="154" text-anchor="middle">Sleep → 07:00</text>
  </g>
  <g fill="#444" font-size="10.5" text-anchor="middle">
    <text x="540" y="147">Get ready</text>
    <text x="540" y="161">for bed</text>
    <text x="600" y="154">Journal</text>
  </g>

  <!-- what the layer does to the calendar -->
  <g fill="#b3261e" font-size="11" text-anchor="middle">
    <path d="M512 180 v5 h116 v-5" fill="none" stroke="#b3261e"/>
    <text x="570" y="198">covered: don't happen</text>
    <path d="M632 180 v5 h56 v-5" fill="none" stroke="#b3261e"/>
    <text x="660" y="212">cut</text>
  </g>

  <!-- result row -->
  <g stroke="#3d7a46" stroke-width="1.2" fill="#dff0e1">
    <rect x="210" y="230" width="60" height="44" rx="4"/>
    <rect x="270" y="230" width="420" height="44" rx="4"/>
    <rect x="690" y="230" width="200" height="44"/>
  </g>
  <g fill="#1f4d27" text-anchor="middle">
    <text x="240" y="256">Dinner</text>
    <text x="480" y="256">Dance class 19:00–22:30</text>
    <text x="790" y="256">Sleep from 22:30</text>
  </g>

  <!-- through and the layer's end -->
  <line x1="390" y1="30" x2="390" y2="300" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="690" y1="30" x2="690" y2="300" stroke="#1d4fb0" stroke-width="2" stroke-dasharray="2 3"/>
  <g text-anchor="middle" font-weight="600">
    <text x="390" y="318" fill="#b45309">through (20:00)</text>
    <text x="690" y="318" fill="#1d4fb0">the layer's end (22:30)</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#555">
    <text x="390" y="334">compaction knows what happened up to here</text>
    <text x="690" y="334">Sleep overlaps it, so Sleep is cut here</text>
  </g>
  <text x="150" y="360" fill="#555" font-size="11">Shaded: what the layer covers. Hatched: calendar time the layer overwrites. The cuts are implied, not stored.</text>
</svg>
